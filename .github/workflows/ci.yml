name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_SSL: disable
      APP_RUNTIME_PASSWORD: ci_test_password
      TEST_DATABASE_URL: postgresql://app_runtime:ci_test_password@localhost:5432/postgres
      JWT_SECRET: test_jwt_secret_de_al_menos_32_caracteres_para_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar migraciones a Postgres de CI
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
