name: Backup base de datos

on:
  schedule:
    # 08:00 UTC todos los días.
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        # El runner trae pg_dump 16 por defecto; el proyecto de Supabase corre Postgres 17, y
        # pg_dump se niega a respaldar un servidor más nuevo que él mismo.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Respaldar PostgreSQL
        run: |
          filename="mechanicpro-$(date +%F).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" --format=custom --file="$filename"
          echo "BACKUP_FILE=$filename" >> "$GITHUB_ENV"
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      - name: Subir respaldo como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
