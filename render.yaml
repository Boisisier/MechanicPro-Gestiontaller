# Blueprint de Render (render.com/docs/blueprint-spec). Define los tres servicios que necesita
# la app: la API (Node/Express, tiene que estar siempre despierta para recibir webhooks de pago
# más adelante), el frontend (build estático de Vite) y la landing de marketing (HTML estático,
# sin build, vive en ./landing y no pasa por Vite — es una página aparte del dashboard).
#
# Las variables marcadas "sync: false" no se pueden completar acá (son secretos o dependen de
# URLs que Render asigna recién al crear los servicios) — Render las va a pedir en el dashboard
# al crear el Blueprint, o hay que completarlas después. Ver docs/produccion.md para el detalle
# paso a paso.

services:
  - name: mechanicpro-gestiontaller-api
    type: web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_DEMO_LOGIN
        value: "false"

  - name: mechanicpro-gestiontaller-web
    type: web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    # Portal de clientes: /estado/<token> es una ruta sin archivo real (el token va en el path,
    # no en query string). Scoped a /estado/* a propósito — un rewrite general a /index.html ya
    # rompió el sitio una vez (ver comentario arriba), así que este no toca nada fuera de esa
    # ruta.
    routes:
      - type: rewrite
        source: /estado/*
        destination: /estado.html

  - name: mechanicpro-landing
    type: web
    runtime: static
    buildCommand: echo "sin build, HTML estático"
    staticPublishPath: ./landing
